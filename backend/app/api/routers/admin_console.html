<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegraph admin console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: #111318; color: #d8d8d8; }
  header { padding: 14px 22px; background: #181b21; border-bottom: 1px solid #262a33; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: #f0f0f0; letter-spacing: .3px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  header .dot.ok { background: #3fb950; }
  header .dot.bad { background: #f85149; }
  main { max-width: 980px; margin: 0 auto; padding: 22px; display: grid; gap: 18px; }
  section { background: #181b21; border: 1px solid #262a33; border-radius: 8px; padding: 16px 18px; }
  section h2 { font-size: 13px; margin: 0 0 12px; color: #9aa4b2; text-transform: uppercase; letter-spacing: .8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=password], input[type=number] { background: #0d0f13; border: 1px solid #33384443; border: 1px solid #333844; color: #e6e6e6; border-radius: 6px; padding: 7px 10px; font: inherit; }
  input[type=number] { width: 110px; }
  button { background: #2d4a78; color: #e8eefc; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #38598f; }
  button.danger { background: #6e3131; }
  button.danger:hover { background: #8a3c3c; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #23262e; font-variant-numeric: tabular-nums; }
  th { color: #9aa4b2; font-weight: 500; font-size: 12px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .kv div { background: #0d0f13; border-radius: 6px; padding: 10px 12px; }
  .kv .v { font-size: 20px; color: #f0f0f0; }
  .kv .k { font-size: 11px; color: #9aa4b2; margin-top: 2px; }
  .msg { font-size: 12px; color: #9aa4b2; min-height: 16px; }
  .msg.err { color: #f85149; }
  #lock { display: grid; place-items: center; min-height: 60vh; }
  #lockbox { text-align: center; }
  #ui { display: none; }
  .hint { color: #768390; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>codegraph admin console</h1>
  <span class="msg" id="hdrmsg"></span>
</header>

<div id="lock">
  <div id="lockbox">
    <div class="row" style="justify-content:center">
      <input type="password" id="tok" placeholder="admin panel token" size="34" autocomplete="off">
      <button id="unlock">Unlock</button>
    </div>
    <div class="msg" id="lockmsg"></div>
    <p class="hint">Token is held in memory for this tab only — nothing is persisted.<br>
    Rotating the token locks every open console on next request.</p>
  </div>
</div>

<main id="ui">
  <section>
    <h2>Rate limit (token bucket, per user)</h2>
    <div class="row">
      <label>capacity <input type="number" id="cap" min="1"></label>
      <label>refill /sec <input type="number" id="ref" step="0.1" min="0.1"></label>
      <button id="saverl">Save</button>
    </div>
    <div class="msg" id="rlmsg"></div>
  </section>

  <section>
    <h2>Query cache</h2>
    <div class="kv" id="cachekv"></div>
    <div class="row" style="margin-top:12px">
      <button data-flush="">Flush all</button>
      <button data-flush="graph">graph</button>
      <button data-flush="git">git</button>
      <button data-flush="tests">tests</button>
    </div>
    <div class="msg" id="cmsg"></div>
  </section>


</main>

<script>
let TOKEN = "";
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({}, opts, {
    headers: Object.assign({ "Authorization": "Bearer " + TOKEN }, (opts.headers || {})),
  }));
  if (r.status === 401) { lock("token rejected"); throw new Error("401"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

function lock(msg) {
  TOKEN = "";
  $("ui").style.display = "none";
  $("lock").style.display = "grid";
  $("dot").className = "dot bad";
  $("lockmsg").textContent = msg || "";
}

async function refresh() {
  try {
    const [rl, cache] = await Promise.all([
      api("/api/admin/rate-limit"),
      api("/api/admin/cache"),
    ]);
    $("dot").className = "dot ok";
    $("hdrmsg").textContent = "";
    if (rl.mcp_capacity != null) { $("cap").value = rl.mcp_capacity; $("ref").value = rl.mcp_refill_per_sec; }
    const ck = cache || {};
    $("cachekv").innerHTML = ["hits","misses","hit_rate","redis_keys","invalidations"]
      .filter(k => ck[k] != null)
      .map(k => `<div><div class="v">${typeof ck[k] === "number" && ck[k] > 1000 ? ck[k].toLocaleString() : ck[k]}</div><div class="k">${k}</div></div>`).join("")
      + (ck.redis_info ? `<div><div class="v">${ck.redis_info.used_memory_human || ""}</div><div class="k">redis memory</div></div>` : "");
  } catch (e) {
    if (e.message !== "401") { $("hdrmsg").textContent = "refresh failed: " + e.message; }
  }
}

$("unlock").onclick = async () => {
  TOKEN = $("tok").value;
  $("tok").value = "";
  if (!TOKEN) return;
  $("lockmsg").textContent = "checking…";
  try {
    await api("/api/admin/rate-limit");
    $("lock").style.display = "none";
    $("ui").style.display = "grid";
    refresh();
    setInterval(refresh, 30000);
  } catch (e) {
    if (e.message !== "401") $("lockmsg").textContent = "error: " + e.message;
    TOKEN = "";
  }
};
$("tok").addEventListener("keydown", (e) => { if (e.key === "Enter") $("unlock").click(); });

$("saverl").onclick = async () => {
  try {
    await api("/api/admin/rate-limit?capacity=" + encodeURIComponent($("cap").value) +
              "&refill_per_sec=" + encodeURIComponent($("ref").value), { method: "PUT" });
    $("rlmsg").textContent = "saved — applies to new calls within 30s";
    $("rlmsg").className = "msg";
    refresh();
  } catch (e) { $("rlmsg").textContent = "failed: " + e.message; $("rlmsg").className = "msg err"; }
};

document.querySelectorAll("[data-flush]").forEach(btn => {
  btn.onclick = async () => {
    const tag = btn.getAttribute("data-flush");
    btn.disabled = true;
    try {
      const res = await api("/api/admin/cache/flush" + (tag ? "?tag=" + tag : ""), { method: "POST" });
      $("cmsg").textContent = "flushed" + (res.removed != null ? ` — ${res.removed} entries` : "");
      $("cmsg").className = "msg";
      refresh();
    } catch (e) { $("cmsg").textContent = "failed: " + e.message; $("cmsg").className = "msg err"; }
    btn.disabled = false;
  };
});
</script>
</body>
</html>
