services:
  postgres:
    image: postgres:16
    container_name: oncall-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: oncall-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: oncall-weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_GOSSIP_BIND_PORT: "7100"
      CLUSTER_DATA_BIND_PORT: "7101"
      CLUSTER_JOIN: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oncall-backend
    ports:
      - "8000:8000"
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${CODEBASE_REPO_PATH}:/repos/codebase:ro
    environment:
      INCIDENT_STORE_BACKEND: postgres
      INDEX_METADATA_BACKEND: postgres
      RESOLVED_ERROR_BACKEND: postgres
      EVAL_CASE_BACKEND: postgres
      SEMANTIC_INDEX_BACKEND: weaviate
      GRAPH_INDEX_BACKEND: neo4j
      POSTGRES_DSN: postgresql://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      WEAVIATE_URL: http://weaviate:8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CODEBASE_ROOT_PATH: /repos/codebase
      INDEXING_ALLOWED_ROOTS: '["/repos/codebase"]'
      INDEX_ON_STARTUP: "false"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3G

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oncall-celery-worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${CODEBASE_REPO_PATH}:/repos/codebase:ro
    environment:
      INCIDENT_STORE_BACKEND: postgres
      INDEX_METADATA_BACKEND: postgres
      RESOLVED_ERROR_BACKEND: postgres
      EVAL_CASE_BACKEND: postgres
      SEMANTIC_INDEX_BACKEND: weaviate
      GRAPH_INDEX_BACKEND: neo4j
      POSTGRES_DSN: postgresql://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      WEAVIATE_URL: http://weaviate:8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CODEBASE_ROOT_PATH: /repos/codebase
      INDEXING_ALLOWED_ROOTS: '["/repos/codebase"]'
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping --timeout 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G


volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  weaviate_data:
