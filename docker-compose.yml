services:
  postgres:
    image: postgres:16
    container_name: oncall-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: oncall-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: oncall-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    container_name: oncall-t2v-transformers
    restart: unless-stopped
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: oncall-weaviate
    restart: unless-stopped
    depends_on:
      - t2v-transformers
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_GOSSIP_BIND_PORT: "7100"
      CLUSTER_DATA_BIND_PORT: "7101"
      CLUSTER_JOIN: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oncall-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${CODEBASE_REPO_PATH}:/repos/codebase:ro
    environment:
      INDEX_METADATA_BACKEND: postgres
      SEMANTIC_INDEX_BACKEND: weaviate
      GRAPH_INDEX_BACKEND: neo4j
      POSTGRES_DSN: postgresql://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_URL: http://weaviate:8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CODEBASE_ROOT_PATH: /repos/codebase
      INDEXING_ALLOWED_ROOTS: '["/repos/codebase"]'
      INDEX_ON_STARTUP: "false"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-[]}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3G

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: oncall-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: oncall-prometheus
    restart: unless-stopped
    environment:
      API_AUTH_TOKEN: "${API_AUTH_TOKEN}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s/__API_TOKEN__/$$API_AUTH_TOKEN/" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml
        && exec prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  loki:
    profiles: ["observability"]
    image: grafana/loki:latest
    container_name: oncall-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:latest
    container_name: oncall-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: oncall-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  blackbox:
    profiles: ["observability"]
    image: prom/blackbox-exporter:latest
    container_name: oncall-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: oncall-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GRAFANA_PG_PASSWORD: "${GRAFANA_PG_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_SECURITY_ALLOW_ANONYMOUS: "false"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  weaviate_data:
  ollama_models:
  prometheus_data:
  loki_data:
  grafana_data:
